<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Le carnet · ARÔMES V&amp;N</title>
  <meta name="description" content="Votre carnet de recettes">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/recettes/assets/logo-aromes-vn-fond.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/recettes/assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="ARÔMES V&amp;N">
  <link rel="manifest" href="/recettes/manifest.webmanifest">
  <meta name="theme-color" content="#FBF8F2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
  <link rel="stylesheet" href="/recettes/assets/recettes.css?v=20261121-r11">
</head>
<body>
  <a class="skip" href="#main">Aller au contenu</a>
  <header class="site-header" id="site-header"></header>
  <main class="wrap" id="main">
    <div id="invites"></div>
    <div class="entete">
      <h1 class="sr-only">ARÔMES V&amp;N, le carnet</h1>
      <img src="/recettes/assets/logo-aromes-vn-recadre.svg" alt="ARÔMES V&amp;N" width="240" height="129">
      <p class="slogan">La curiosité se cuisine</p>
      <span class="filet" aria-hidden="true"></span>
    </div>
    <form class="recherche" id="search-form" role="search">
      <label class="sr-only" for="q">Rechercher une recette</label>
      <input type="search" id="q" placeholder="Une recette, un ingrédient…" autocomplete="off" enterkeyhint="search">
      <button class="btn" type="submit">Chercher</button>
    </form>
    <div class="nl-mode type-bascule"><div class="onglets" role="group" aria-label="Contenu du carnet">
      <button type="button" class="onglet" data-type="recettes" aria-pressed="true">Recettes</button>
      <button type="button" class="onglet" data-type="astuces" aria-pressed="false">Astuces</button></div></div>
    <div class="nl-mode" id="nl-mode"><div class="onglets" role="group" aria-label="Mode de recherche">
      <button type="button" class="onglet" data-mode="mots" aria-pressed="true">Mots</button>
      <button type="button" class="onglet" data-mode="question" aria-pressed="false">Question</button></div>
      <p class="aide" id="nl-aide" hidden>Posez votre question comme à voix haute : « un dessert rapide sans crème pour cet automne ». Vous vérifiez ensuite ce qui a été compris.</p></div>
    <div class="nl-pastilles" id="nl-pastilles" aria-live="polite"></div>
    <div class="filtres" role="group" aria-label="Statut">
      <button type="button" class="btn sec petit" data-statut="a_verifier" aria-pressed="false">À vérifier</button>
      <button type="button" class="btn sec petit" data-statut="famille" aria-pressed="false">De famille</button>
      <button type="button" class="btn sec petit" data-statut="toutes" aria-pressed="true">Toutes</button>
    </div>
    <div class="ligne-filtres" id="ligne-filtres">
      <label>Carnet<select id="book"></select></label>
      <label id="course-l">Type de plat<select id="course"><option value="">Tous</option></select></label>
      <label id="cat-l" hidden>Catégorie<select id="cat"><option value="">Toutes</option></select></label>
    </div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <div id="liste" aria-busy="true"><p class="chargement">Chargement du carnet…</p></div>
  </main>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/recettes/assets/recettes.js?v=20261121-r11"></script>
  <script src="/recettes/assets/p-index.js?v=20261121-r11"></script>
</body>
</html>
