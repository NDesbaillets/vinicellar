<style>
/* Maquettes cliquables, largeur iPhone. Jetons de l'étape 4, clair uniquement. */
:root {
  color-scheme: light;
  --bg: #F7F5EF; --card: #FFFFFF; --sunk: #ECEEE5; --line: #DDE2D4;
  --ink: #262C25; --ink-2: #535D50; --ink-3: #66705F;
  --wine: #713D47; --wine-2: #5C3039; --wine-soft: #F0E5E7;
  --gold: #A9824C; --olive: #67735F; --visual-bg: #FFFFFF;
  --st-young: #4C5F86; --st-young-bg: #E5E9F2; --st-ready: #2F6E4F; --st-ready-bg: #E3F0E8;
  --st-peak: #713D47; --st-peak-bg: #F0E5E7; --st-soon: #7E560C; --st-soon-bg: #F8EED8;
  --display: Fraunces, Georgia, serif; --ui: Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; --script: WindSong, "Snell Roundhand", cursive;
  --fs-1: .75rem; --fs-2: .875rem; --fs-3: 1rem; --fs-4: 1.25rem; --fs-5: 1.5rem; --fs-6: 2rem; --fs-7: 2.5rem;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px; --s-7: 48px;
  --r-s: 8px; --r-m: 14px; --r-pill: 999px;
  --sh-1: 0 1px 2px rgba(38,44,37,.06), 0 1px 1px rgba(38,44,37,.04);
  --sh-2: 0 6px 20px rgba(38,44,37,.10), 0 2px 4px rgba(38,44,37,.05);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 var(--fs-3)/1.5 var(--ui); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--wine); outline-offset: 2px; }
.d { font-family: var(--display); font-weight: 500; font-optical-sizing: auto; font-variant-numeric: lining-nums; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* sélecteur de maquette (hors app) */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: #262C25; }
.proto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: #262C25; color: #F7F5EF; }
.proto-in { max-width: 430px; margin: 0 auto; padding-block: var(--s-2); display: grid; gap: 6px; }
.proto-row { display: grid; grid-template-columns: 44px repeat(3, 1fr); gap: 4px; align-items: center; }
.proto-row span { font-size: var(--fs-1); color: #B8BFB0; text-transform: uppercase; letter-spacing: .08em; }
.proto a { text-decoration: none; color: #DDE2D4; text-align: center; font-size: var(--fs-1); line-height: 1.2; padding: 6px 2px; border-radius: 6px; background: rgba(255,255,255,.07); min-height: 36px; display: grid; place-content: center; }
.proto a b { display: block; color: #FFFFFF; font-size: var(--fs-2); }

.screen { max-width: 430px; margin: 0 auto; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); min-height: 100vh; }

/* en-tête d'app et barre d'onglets */
.apphead { display: flex; align-items: center; justify-content: space-between; padding-block: var(--s-2) 0; }
.brand { font-family: var(--script); font-size: 2rem; color: var(--wine); line-height: 1.2; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; font: 600 var(--fs-2) var(--ui); color: var(--ink-2); border: 0; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: rgba(255,255,255,.94); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { max-width: 430px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tab { background: none; border: 0; padding: 8px 0 6px; display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--ink-3); min-height: 52px; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="true"] { color: var(--wine); font-weight: 600; }
.tab.add .pill { width: 34px; height: 26px; border-radius: var(--r-pill); background: var(--wine); color: #FFFFFF; display: grid; place-items: center; }
.tab.add .pill svg { width: 18px; height: 18px; }

/* commun */
.seg { display: flex; gap: 2px; background: var(--sunk); border-radius: var(--r-s); padding: 2px; overflow-x: auto; scrollbar-width: none; }
.seg button { flex: 1 0 auto; border: 0; background: none; padding: 8px 12px; border-radius: 6px; font-size: var(--fs-2); color: var(--ink-2); min-height: 36px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: var(--sh-1); }
.btn { min-height: 48px; border: 0; border-radius: var(--r-pill); background: var(--wine); color: #FFFFFF; font-weight: 600; padding: 0 var(--s-5); display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); }
.btn.sec { background: var(--card); color: var(--wine); box-shadow: inset 0 0 0 1px var(--wine); }
.btn.sm { min-height: 36px; padding: 0 var(--s-3); font-size: var(--fs-2); }
.btn svg { width: 18px; height: 18px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 600 var(--fs-1)/1 var(--ui); padding: 5px 9px; border-radius: var(--r-pill); white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.st-young { color: var(--st-young); background: var(--st-young-bg); } .st-ready { color: var(--st-ready); background: var(--st-ready-bg); }
.st-peak { color: var(--st-peak); background: var(--st-peak-bg); } .st-soon { color: var(--st-soon); background: var(--st-soon-bg); }
.eyebrow { font: 600 var(--fs-1)/1.2 var(--ui); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin: 0; }
.h2 { font-size: var(--fs-5); margin: 0; line-height: 1.15; }
.thumb { position: relative; background: var(--visual-bg); display: grid; place-items: end center; overflow: hidden; }
.thumb svg.bottle { height: 90%; width: auto; }
.flag { position: absolute; top: 8px; left: 8px; width: 22px; height: 22px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 1.5px var(--card), var(--sh-1); }
.flag svg { width: 100%; height: 100%; display: block; }
.stars { color: var(--gold); letter-spacing: 1px; }
.search { display: grid; grid-template-columns: 1fr auto auto; gap: var(--s-2); }
.search input { min-width: 0; height: 40px; border: 0; background: var(--sunk); border-radius: var(--r-s); padding: 0 var(--s-3); font: inherit; font-size: var(--fs-2); color: var(--ink); }
.icon-btn { width: 40px; height: 40px; border-radius: var(--r-s); border: 0; background: var(--sunk); display: grid; place-items: center; color: var(--ink-2); }
.icon-btn svg { width: 20px; height: 20px; }
.stack { display: grid; gap: var(--s-4); }

/* cartes de grille */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
.card { background: var(--card); border-radius: var(--r-m); box-shadow: var(--sh-1); overflow: hidden; display: grid; grid-template-rows: auto 1fr; text-align: left; border: 0; padding: 0; position: relative; }
.card .thumb { height: 164px; }
.card-b { padding: var(--s-3); display: grid; gap: 6px; align-content: start; min-width: 0; }
.card-n { font-size: var(--fs-4); line-height: 1.1; margin: 0; text-wrap: balance; }
.card-m { font-size: var(--fs-1); color: var(--ink-2); }
.card-f { display: flex; justify-content: space-between; align-items: center; gap: var(--s-2); margin-top: 2px; }
.qty { font: 600 var(--fs-2) var(--ui); font-variant-numeric: tabular-nums; color: var(--ink); }
.qty small { font-weight: 400; color: var(--ink-3); }
.out { border: 0; background: var(--wine-soft); color: var(--wine); font: 600 var(--fs-1) var(--ui); border-radius: var(--r-pill); padding: 0 12px; min-height: 32px; position: relative; }
.out::after { content: ""; position: absolute; inset: -6px -4px; }

/* rangée horizontale */
.hrow { display: flex; gap: var(--s-3); overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); padding-bottom: 4px; }
.mini { flex: 0 0 132px; scroll-snap-align: start; background: var(--card); border-radius: var(--r-m); box-shadow: var(--sh-1); overflow: hidden; border: 0; padding: 0; text-align: left; display: grid; }
.mini .thumb { height: 128px; }
.mini .flag { width: 18px; height: 18px; }
.mini-b { padding: var(--s-2) var(--s-3) var(--s-3); display: grid; gap: 4px; }
.mini-n { font-size: var(--fs-3); line-height: 1.15; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* mur (C3) */
.wall { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-2); }
.brick { background: var(--card); border-radius: var(--r-m); border: 0; padding: 0; overflow: hidden; display: grid; text-align: center; box-shadow: var(--sh-1); }
.brick .thumb { height: 128px; }
.brick .flag { width: 16px; height: 16px; top: 6px; left: 6px; }
.brick .dot { position: absolute; top: 8px; right: 8px; width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 0 2px var(--card); }
.brick .badge { position: absolute; bottom: 6px; right: 6px; font: 600 11px/1 var(--ui); background: var(--ink); color: #FFFFFF; border-radius: var(--r-pill); padding: 3px 6px; font-variant-numeric: tabular-nums; }
.brick-n { font: 500 var(--fs-1)/1.25 var(--ui); padding: 6px 6px 8px; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.legend { display: flex; flex-wrap: wrap; gap: var(--s-3); font-size: var(--fs-1); color: var(--ink-2); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-2); }
.sec-h .n { font-size: var(--fs-2); color: var(--ink-3); }

/* fiche, commun */
.back { display: flex; align-items: center; justify-content: space-between; padding-block: var(--s-2); }
.back button { border: 0; background: none; color: var(--wine); font-weight: 500; display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0; }
.back svg { width: 22px; height: 22px; }
.facts { display: grid; grid-template-columns: auto 1fr; margin: 0; font-size: var(--fs-2); }
.facts dt { color: var(--ink-3); padding: 9px var(--s-4) 9px 0; border-bottom: 1px solid var(--line); }
.facts dd { margin: 0; padding: 9px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.facts dt:last-of-type, .facts dd:last-of-type { border-bottom: 0; }
.panel { background: var(--card); border-radius: var(--r-m); box-shadow: var(--sh-1); padding: var(--s-4); display: grid; gap: var(--s-3); }
.panel.tight { padding-block: var(--s-1); }
.cellar { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: var(--s-2); font-size: var(--fs-2); }
.cellar > span:first-child { color: var(--ink-2); }
.cellar .q { min-width: 1.5em; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.step { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); font: 500 1.25rem/1 var(--ui); }
.stock-head { display: flex; align-items: baseline; justify-content: space-between; }
.stock-n { font-size: var(--fs-5); line-height: 1; }
.stock-n small { font: 500 var(--fs-2) var(--ui); color: var(--ink-2); margin-left: 4px; }
.tl { display: grid; gap: var(--s-2); }
.tl-bar { position: relative; height: 10px; border-radius: var(--r-pill); background: var(--sunk); }
.tl-bar span { position: absolute; top: 0; bottom: 0; border-radius: var(--r-pill); }
.tl-drink { background: var(--st-ready-bg); box-shadow: inset 0 0 0 1px rgba(47,110,79,.35); }
.tl-peak { background: var(--wine); }
.tl-now { top: -5px !important; bottom: auto !important; width: 2px; height: 20px; background: var(--ink); }
.tl-ax { display: flex; justify-content: space-between; font-size: var(--fs-1); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.tl-legend { display: flex; flex-wrap: wrap; gap: var(--s-3); font-size: var(--fs-1); color: var(--ink-2); }
.tl-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.tasting { font-size: var(--fs-2); display: grid; gap: 2px; }
.tasting .meta { font-size: var(--fs-1); color: var(--ink-3); }
.tasting p { margin: 0; }
.more { border: 0; background: none; color: var(--wine); font-weight: 600; font-size: var(--fs-2); min-height: 44px; padding: 0; text-align: left; display: flex; align-items: center; gap: 4px; }
.more svg { width: 18px; height: 18px; transition: transform .2s; }
.more[aria-expanded="true"] svg { transform: rotate(180deg); }
.full { display: grid; gap: var(--s-4); font-size: var(--fs-2); }
.full h4 { margin: 0 0 4px; font: 600 var(--fs-1)/1.2 var(--ui); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.full p { margin: 0; max-width: 62ch; }
.scores { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-2); }
.scores div { background: var(--sunk); border-radius: var(--r-s); padding: var(--s-3); display: grid; gap: 2px; }
.scores b { font: 500 var(--fs-5)/1 var(--display); }
.scores span { font-size: var(--fs-1); color: var(--ink-2); }
.fold { position: relative; height: 0; }
.fold span { position: absolute; left: 0; right: 0; top: -14px; border-top: 2px dashed #C48C6A; font: 600 10px/1 var(--ui); color: #9A5B3A; text-align: right; padding: 0 8px 3px; border-top: 0; border-bottom: 2px dashed #C48C6A; letter-spacing: .04em; text-transform: uppercase; pointer-events: none; z-index: 2; }

/* F1 */
.f1-hero { display: grid; grid-template-columns: 128px 1fr; gap: var(--s-4); align-items: end; background: var(--card); border-radius: var(--r-m); box-shadow: var(--sh-2); padding: var(--s-4); }
.f1-hero .thumb { height: 196px; border-radius: var(--r-s); }
.f1-hero .flag { width: 26px; height: 26px; }
.who { display: grid; gap: 4px; min-width: 0; }
.who .p { font-size: var(--fs-2); color: var(--ink-2); }
.who h1 { font-size: var(--fs-6); line-height: 1.04; margin: 0; text-wrap: balance; }
.who .v { font-size: var(--fs-5); color: var(--wine); line-height: 1.1; }
.who .o { font-size: var(--fs-2); color: var(--ink-2); }
.who .r { display: flex; align-items: center; gap: var(--s-2); font-size: var(--fs-2); }
.who .r b { font-weight: 600; }
.who .r small { color: var(--ink-3); font-size: var(--fs-1); }
.tapnote { font-size: var(--fs-1); color: var(--ink-3); text-align: center; margin: 0; }

/* F2 */
.f2-stage { background: var(--card); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-top: var(--s-2); display: grid; justify-items: center; gap: var(--s-2); padding-bottom: var(--s-4); border-bottom: 1px solid var(--line); }
.f2-stage .thumb { width: 100%; height: 300px; }
.f2-stage .flag { width: 30px; height: 30px; left: max(16px, env(safe-area-inset-left, 0px)); top: 4px; }

.f2-stage .who h1 { font-size: var(--fs-6); }
.f2-bar { position: fixed; left: 0; right: 0; bottom: calc(53px + env(safe-area-inset-bottom, 0px)); z-index: 14; background: rgba(255,255,255,.96); backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
.f2-bar-in { max-width: 430px; margin: 0 auto; display: grid; grid-template-columns: auto auto auto 1fr; gap: var(--s-2); align-items: center; padding-block: var(--s-2); }
.f2-bar .n { font: 500 var(--fs-5)/1 var(--display); min-width: 1.4em; text-align: center; font-variant-numeric: lining-nums; }
.f2-bar .lbl { font-size: var(--fs-1); color: var(--ink-3); line-height: 1.1; }
.f2-bar .btn { justify-self: end; }
.screen.f2 { padding-bottom: calc(170px + env(safe-area-inset-bottom, 0px)); }

.f3-top { background: var(--card); border-radius: var(--r-m); box-shadow: var(--sh-2); padding: var(--s-3); display: grid; grid-template-columns: 96px 1fr; gap: var(--s-3); align-items: center; }

.f3-top .flag { width: 20px; height: 20px; top: 6px; left: 6px; }
.f3-top .who h1 { font-size: var(--fs-5); }
.f3-top .who .v { font-size: var(--fs-4); }
.f3-stock { display: grid; grid-template-columns: auto 1fr auto; gap: var(--s-3); align-items: center; }
.f3-stock .mini-step { display: flex; align-items: center; gap: var(--s-1); }

/* feuille Sortir */
.scrim { position: fixed; inset: 0; background: rgba(38,44,37,.35); z-index: 40; display: grid; align-items: end; }
.sheet { background: var(--card); border-radius: var(--r-m) var(--r-m) 0 0; box-shadow: var(--sh-2); width: 100%; max-width: 430px; margin: 0 auto; padding-block: var(--s-2) calc(var(--s-5) + env(safe-area-inset-bottom, 0px)); display: grid; gap: var(--s-4); }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--line); justify-self: center; }
.sheet-head { display: grid; grid-template-columns: 44px 1fr; gap: var(--s-3); align-items: center; }

.rate button.on { color: var(--gold); }
.sheet textarea { width: 100%; min-height: 72px; border: 0; background: var(--sunk); border-radius: var(--r-s); padding: var(--s-3); font: inherit; font-size: var(--fs-2); resize: vertical; color: var(--ink); }
.sheet .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-2); }
.sheet label { font-size: var(--fs-1); color: var(--ink-3); display: grid; gap: 4px; }
.sheet .fake { background: var(--sunk); border-radius: var(--r-s); min-height: 40px; display: flex; align-items: center; padding: 0 var(--s-3); font-size: var(--fs-2); color: var(--ink); }
.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #FFFFFF; font-size: var(--fs-2); padding: 10px 16px; border-radius: var(--r-pill); z-index: 50; box-shadow: var(--sh-2); white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(40px); opacity: .6; } } }
</style>

    s.innerHTML = `<div class="sheet gut" role="dialog" aria-label="Sortir une bouteille"><span class="grab"></span>
      <div class="sheet-head">${thumb(w)}<div><h3 class="d">${w.n} ${w.v}</h3><span class="sub">${caves.length > 1 ? "" : CAVES[caves[0]] + " · "}${tot(w)} en cave</span></div></div>
      <div class="seg" role="group"><button data-k="Bue" aria-pressed="true">Bue</button><button data-k="Offerte" aria-pressed="false">Offerte</button></div>
      ${caves.length > 1 ? `<div class="seg" role="group" aria-label="Depuis">${caves.map((k, i) => `<button data-from="${k}" aria-pressed="${i === 0}">${CAVES[k]}</button>`).join("")}</div>` : ""}
      <div data-rate-wrap><div class="eyebrow" style="margin-bottom:6px">Ma note</div><div class="rate">${[1, 2, 3, 4, 5].map((i) => `<button data-s="${i}" aria-label="${i} étoile${i > 1 ? "s" : ""}">★</button>`).join("")}</div></div>
      <textarea id="sortir-note" placeholder="Note de dégustation, avec quoi, avec qui… (facultatif)"></textarea>
      <div class="row2"><label>Date<span class="fake">15.11.2026</span></label><label data-to hidden>Offerte à<span class="fake" style="color:var(--ink-3)">Nom</span></label></div>
      <div style="display:grid;grid-template-columns:auto 1fr;gap:var(--s-2)"><button class="btn sec" data-x>Annuler</button><button class="btn" data-ok>Enregistrer</button></div></div>`;
    document.body.appendChild(s);
    s.addEventListener("click", (e) => {
      const t = e.target.closest("button");
      if (e.target === s || (t && t.hasAttribute("data-x"))) return s.remove();
      if (!t) return;
      if (t.dataset.k) { kind = t.dataset.k; s.querySelectorAll("[data-k]").forEach((b) => b.setAttribute("aria-pressed", b === t)); s.querySelector("[data-to]").hidden = kind !== "Offerte"; s.querySelector("[data-rate-wrap]").hidden = kind === "Offerte"; }
      if (t.dataset.from) s.querySelectorAll("[data-from]").forEach((b) => b.setAttribute("aria-pressed", b === t));
      if (t.dataset.s) { stars = +t.dataset.s; s.querySelectorAll("[data-s]").forEach((b) => b.classList.toggle("on", +b.dataset.s <= stars)); }
      if (t.hasAttribute("data-ok")) { const from = s.querySelector('[data-from][aria-pressed="true"]')?.dataset.from || caves[0]; w.q[from]--; s.remove(); toast(`${kind === "Bue" ? "Bouteille bue" : "Bouteille offerte"} · reste ${tot(w)}`); render(); }
    });
  }

  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-open],[data-out],[data-cave],[data-back],[data-more],[data-step],[data-f3],[data-photos],.tab,.avatar");
    if (!t || t.closest(".scrim")) return;
    if (t.dataset.out) { e.stopPropagation(); return sortir(t.dataset.out); }
    if (t.dataset.open) { window.__wid = +t.dataset.open; location.hash = route[0] === "f" ? route : "f1"; if (route[0] === "f") render(); return; }
    if (t.dataset.cave) { cave = t.dataset.cave; return render(); }
    if (t.hasAttribute("data-back")) { location.hash = lastCave; return; }
    if (t.hasAttribute("data-more")) { const open = t.getAttribute("aria-expanded") !== "true"; t.setAttribute("aria-expanded", open); t.nextElementSibling.hidden = !open; placeFold(); return; }
    if (t.dataset.step) { const w = cur(); w.q[t.dataset.c] = Math.max(0, w.q[t.dataset.c] + +t.dataset.step); render(); return toast(+t.dataset.step > 0 ? "Bouteille ajoutée" : "Stock corrigé, sans trace dans le carnet"); }
    if (t.dataset.f3) { f3tab = t.dataset.f3; return render(); }
    if (t.hasAttribute("data-photos")) return toast("Ouvre la galerie : photos, aperçu, bouteille entière");
    if (t.classList.contains("tab") || t.classList.contains("avatar")) return toast("Hors du périmètre de ces maquettes");
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.dataset && e.target.dataset.open) e.target.click(); if (e.key === "Escape") document.querySelector(".scrim")?.remove(); });
  go((location.hash || "#c1").slice(1));
})();
</script>
