<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Hors ligne · Vinicellar</title>
  <link rel="icon" href="/assets/img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#F7F5EF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151B17" media="(prefers-color-scheme: dark)">
  <style>
    :root { --bg: #F7F5EF; --ink: #231A17; --ink-2: #5F534C; --wine: #6B1E2E; --on: #fff; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg: #151B17; --ink: #F2EBE3; --ink-2: #C3B6AC; --wine: #D7798A; --on: #1E1916; color-scheme: dark; } }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font: 500 1.6rem/1.2 Georgia, serif; margin: 18px 0 8px; }
    p { color: var(--ink-2); max-width: 340px; margin: 0 auto 20px; }
    a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px; background: var(--wine); color: var(--on); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/img/icon.svg" alt="">
    <h1>Vous êtes hors ligne</h1>
    <p>Vos caves et vos fiches sont en ligne. Reconnectez-vous au réseau, puis réessayez.</p>
    <a href="/app/">Réessayer</a>
  </main>
</body>
</html>
