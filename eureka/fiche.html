<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9A4A2B">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co https://photon.komoot.io; img-src 'self' https:; style-src 'self'; font-src 'self'; frame-src https://www.openstreetmap.org; base-uri 'none'; form-action 'self'">
  <title>Fiche idée · Eurêka</title>
  <link rel="manifest" href="/eureka/manifest.webmanifest">
  <link rel="icon" href="/eureka/assets/monogramme.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/eureka/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/eureka/assets/eureka.css?v=21">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
  <script defer src="/assets/js/config.js"></script>
  <script defer src="/eureka/assets/eureka.js"></script>
  <script defer src="/eureka/assets/creneaux.js"></script>
  <script defer src="/eureka/assets/p-fiche.js?v=22"></script>
</head>
<body>
  <main id="main" class="fiche">
    <p id="state" role="status">Chargement…</p>
  <article id="idea" hidden>
    <div id="hero" class="hero">
      <a class="back button" href="/eureka/" aria-label="Retour aux idées">←</a>
      <span id="urgent" class="badge" hidden>Urgent</span>
    </div>
    <header class="intro">
      <p id="meta" class="eyebrow"></p>
      <h1 id="title"></h1>
      <p id="pitch" class="pitch"></p>
    </header>
    <section id="import-section" hidden><h2>Ajout rapide</h2>
      <p id="import-status" role="status"></p>
      <button id="retry-import" type="button" hidden>Relancer l’enrichissement</button>
    </section>
    <section id="gallery-section" hidden>
      <h2>Illustrations</h2>
      <div id="gallery" class="gallery"></div>
      <form id="illustration-form" class="photo-form actions" hidden>
        <label class="grow">Photo de couverture <input name="photos" type="file" accept="image/jpeg,image/png,image/webp"></label>
        <button type="button" class="paste-photo">Coller une illustration</button>
        <button>Ajouter l’illustration</button>
        <p class="photo-status wide-feedback" role="status"></p>
      </form>
    </section>
    <section><h2>Envie</h2><div id="scores" class="scores"></div></section>
    <section id="description-section" hidden><h2>Ce qui vous attend</h2><p id="description" class="prose"></p></section>
    <section><h2>Organiser</h2><div id="map" hidden></div><dl id="details" class="rows"></dl></section>
    <section id="options-section" hidden><h2>Options</h2><ul id="options" class="rows list"></ul></section>
    <section id="annual-season" hidden>
      <h2>Chaque année</h2>
      <p id="annual-period"></p>
      <p id="annual-state" role="status"></p>
    </section>
    <section><h2>Occurrences</h2><div id="occurrences" class="rows"></div></section>
    <section id="souvenirs-section" hidden>
      <h2>Photos souvenirs</h2>
      <div id="souvenirs-gallery" class="gallery"></div>
      <form id="souvenirs-form" class="photo-form actions" hidden>
        <label class="grow">Photos de l’activité <input name="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label>
        <button type="button" class="paste-photo">Coller des photos</button>
        <button>Ajouter les photos</button>
        <p class="photo-status wide-feedback" role="status"></p>
      </form>
    </section>
    <section id="following" hidden>
      <h2>Suivre cette idée</h2>
      <div id="following-controls" class="rows"></div>
      <p id="following-status" role="status"></p>
    </section>
    <section id="edit-actions" hidden>
      <h2>Suivi</h2>
      <form id="status-form" class="actions">
        <label class="grow">Statut de l’idée <select name="statut"></select></label>
        <button>Changer le statut</button>
      </form>
      <form id="plan-form" class="actions">
        <label id="season-picker" class="grow" hidden>Saison <select name="saison" disabled></select></label>
        <label class="grow">Date prévue <input type="date" name="date" required></label>
        <button class="primary">Planifier</button>
      </form>
      <div class="actions form-end">
        <a id="edit" class="button" href="editer.html">Modifier l’idée</a>
        <a id="complete-idea" class="button" href="editer.html#completer-ia">Compléter avec l’IA</a>
      </div>
      <p id="action-status" role="status"></p>
    </section>
  <section id="delete-idea" hidden>
    <button class="delete-link" type="button">Supprimer la fiche</button>
    <dialog aria-labelledby="delete-title" aria-describedby="delete-description">
      <h2 id="delete-title">Supprimer la fiche</h2>
      <p id="delete-description"></p>
      <form method="dialog" class="actions">
        <button value="cancel" autofocus>Annuler</button>
        <button value="delete" class="delete-link">Supprimer définitivement</button>
      </form>
      <p class="delete-status" role="status"></p>
    </dialog>
  </section>
  </article>
  </main>
  <nav id="nav" class="nav" aria-label="Eurêka" hidden></nav>
  <noscript>Activez JavaScript pour utiliser Eurêka.</noscript>
</body>
</html>
