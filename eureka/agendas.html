<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9A4A2B">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co; img-src 'self' https:; style-src 'self'; font-src 'self'; frame-src https://www.openstreetmap.org; base-uri 'none'; form-action 'self'">
  <title>Agendas · Eurêka</title>
  <link rel="manifest" href="/eureka/manifest.webmanifest">
  <link rel="icon" href="/eureka/assets/monogramme.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/eureka/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/eureka/assets/eureka.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
  <script defer src="/assets/js/config.js"></script>
  <script defer src="/eureka/assets/eureka.js"></script>
  <script defer src="/eureka/assets/p-agendas.js"></script>
</head>
<body>
  <main id="main" class="agendas">
    <p id="state" role="status">Chargement…</p>
  <header class="masthead">
    <a id="back-reminders" class="button" href="rappels.html">← Rappels</a>
    <h1>Agendas</h1>
  </header>
  <div id="agenda-page" hidden>
    <section>
      <h2>Calendriers iCloud</h2>
      <div class="actions">
        <button id="discover" type="button">Découvrir les calendriers</button>
        <button id="synchronize" type="button">Actualiser les plages</button>
      </div>
      <p id="sync-status" role="status"></p>
      <div id="calendars" class="rows"></div>
    </section>
    <section>
      <h2>Les sept prochains jours</h2>
      <ul id="busy-list" class="rows list"></ul>
    </section>
    <section>
      <h2>Créneaux provisoires</h2>
      <form id="slot-settings">
        <div class="fields">
          <label class="wide">Calendrier d’écriture <select name="calendrier"></select></label>
          <label>Heure du créneau <input name="heure" type="time"></label>
          <label>Durée en minutes <input name="duree" type="number" min="30" max="480" step="5"></label>
        </div>
        <p>Pour activer les créneaux J3, choisissez un calendrier iCloud « Eurêka » actif et modifiable.</p>
        <div class="actions form-end"><button class="primary">Enregistrer</button></div>
        <p id="slot-status" role="status"></p>
      </form>
      <ul id="slots" class="rows list"></ul>
    </section>
  </div>
</main>
  <nav id="nav" class="nav" aria-label="Eurêka" hidden></nav>
  <noscript>Activez JavaScript pour utiliser Eurêka.</noscript>
</body>
</html>
