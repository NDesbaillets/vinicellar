<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9A4A2B">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co; img-src 'self' https:; style-src 'self'; font-src 'self'; frame-src https://www.openstreetmap.org; base-uri 'none'; form-action 'self'">
  <title>Rappels · Eurêka</title>
  <link rel="manifest" href="/eureka/manifest.webmanifest">
  <link rel="icon" href="/eureka/assets/monogramme.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/eureka/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/eureka/assets/eureka.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
  <script defer src="/assets/js/config.js"></script>
  <script defer src="/eureka/assets/eureka.js"></script>
  <script defer src="/eureka/assets/p-rappels.js"></script>
</head>
<body>
  <main id="main" class="rappels">
    <p id="state" role="status">Chargement…</p>
  <header class="masthead"><h1>Rappels</h1></header>
  <div id="reminders-page" hidden>
    <a id="agenda-link" class="button" href="agendas.html" hidden>Gérer mes agendas iCloud</a>
    <section id="reminders-section">
      <h2>Mes rappels</h2>
      <ul id="reminder-list" class="rows list"></ul>
    </section>
    <section id="pending-section" hidden>
      <h2>Demandes de suivi</h2>
      <ul id="pending-list" class="rows list"></ul>
    </section>
    <section>
      <h2>Notifications</h2>
      <p id="push-status" role="status"></p>
      <button id="toggle-push" type="button" hidden>Activer sur cet appareil</button>
    </section>
    <section>
      <h2>Réglages</h2>
      <form id="preferences">
        <div class="fields">
          <label>Maximum par jour <input name="max" type="number" min="0" max="2" step="1" required></label>
          <label>Ton <select name="ton"><option value="direct_humour">Direct et complice</option><option value="neutre">Neutre</option></select></label>
          <label>Heure en semaine <input name="semaine" type="time" required></label>
          <label>Heure le week-end <input name="weekend" type="time" required></label>
        </div>
        <details>
          <summary>Poids du classement</summary>
          <div class="fields">
            <label>Envie <input name="envie" type="number" min="0" max="5" step="0.1" required></label>
            <label>Urgence <input name="urgence" type="number" min="0" max="5" step="0.1" required></label>
            <label>Saison <input name="saison" type="number" min="0" max="5" step="0.1" required></label>
            <label>Ajouts répétés <input name="ajouts" type="number" min="0" max="5" step="0.1" required></label>
            <label>Suggestion récente (malus) <input name="recent" type="number" min="0" max="5" step="0.1" required></label>
          </div>
        </details>
        <div class="actions form-end"><button class="primary">Enregistrer</button></div>
        <p id="preferences-status" role="status"></p>
      </form>
    </section>
  </div>
</main>
  <nav id="nav" class="nav" aria-label="Eurêka" hidden></nav>
  <noscript>Activez JavaScript pour utiliser Eurêka.</noscript>
</body>
</html>
