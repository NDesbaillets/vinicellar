<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9A4A2B">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co; img-src 'self' https:; style-src 'self'; font-src 'self'; frame-src https://www.openstreetmap.org; base-uri 'none'; form-action 'self'">
  <title>Planification · Eurêka</title>
  <link rel="manifest" href="/eureka/manifest.webmanifest">
  <link rel="icon" href="/eureka/assets/monogramme.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/eureka/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/eureka/assets/eureka.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
  <script defer src="/assets/js/config.js"></script>
  <script defer src="/eureka/assets/eureka.js"></script>
  <script defer src="/eureka/assets/p-planification.js"></script>
</head>
<body>
  <main id="main" class="planning">
    <p id="state" role="status">Chargement…</p>
  <header class="masthead"><h1>Planification</h1></header>
  <div id="planning-content" hidden>
    <div class="planning-shortcuts actions">
      <a class="button" href="#planning-tasks-section">À planifier</a>
      <a class="button" href="#planning-suggestions-section">Suggestions</a>
    </div>
    <section class="planning-agenda">
      <h2>Agenda</h2>
      <div class="agenda-controls">
        <button id="previous-day" type="button" aria-label="Reculer d’un jour">←</button>
        <button id="today" type="button">Aujourd’hui</button>
        <button id="next-day" type="button" aria-label="Avancer d’un jour">→</button>
        <label class="agenda-date">Début de la période <input id="agenda-date" type="date"></label>
      </div>
      <p id="agenda-range" role="status"></p>
      <p id="agenda-status" role="status"></p>
      <div id="agenda-days"></div>
      <a id="planned-catalogue" class="button" href="/eureka/?statut=planifiee">Voir les fiches planifiées</a>
    </section>
    <section id="planning-tasks-section">
      <h2>À planifier</h2>
      <p id="planning-tasks-status" role="status">Chargement…</p>
      <ul id="planning-tasks" class="rows list"></ul>
    </section>
    <section id="planning-suggestions-section">
      <h2>Suggestions</h2>
      <p id="planning-suggestions-status" role="status">Chargement…</p>
      <ul id="planning-suggestions" class="rows list"></ul>
    </section>
  </div>
</main>
  <nav id="nav" class="nav" aria-label="Eurêka" hidden></nav>
  <noscript>Activez JavaScript pour utiliser Eurêka.</noscript>
</body>
</html>
